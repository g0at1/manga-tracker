name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # The app targets macOS 26 and uses its SwiftUI APIs, so it needs an
    # image whose Xcode ships a macOS 26 SDK.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project MangaTracker.xcodeproj

      - name: Build app
        run: |
          xcodebuild \
            -project MangaTracker.xcodeproj \
            -scheme MangaTracker \
            -configuration Debug \
            -destination 'platform=macOS' \
            clean build

      - name: Build iOS app
        run: |
          xcodebuild \
            -project MangaTracker.xcodeproj \
            -scheme MangaTrackerIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
