name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # The app targets macOS 26 and uses its SwiftUI APIs, so it needs an
    # image whose Xcode ships a macOS 26 SDK.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project MangaTracker.xcodeproj

      # Shared with the Tests workflow (same key), so whichever runs first
      # pays for the ~900 MB Firebase download.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('MangaTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build macOS app
        run: |
          xcodebuild \
            -project MangaTracker.xcodeproj \
            -scheme MangaTracker \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Build iOS app
        run: |
          xcodebuild \
            -project MangaTracker.xcodeproj \
            -scheme MangaTrackerIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
