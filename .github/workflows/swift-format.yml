name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  Lint:
    # Pinned so a new image's SwiftFormat can't start failing the lint unannounced.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log
